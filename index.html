<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Here Lies helps you stop impulse shopping with a waiting room, a safe person, an AI coach, streaks and a wishlist graveyard.">
<meta name="theme-color" content="#FAF6EF">
<style>[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Here Lies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Soft luxury: cream paper, powder blue, champagne gold. Sidebar dashboard on desktop, slide-out menu on phones. Light only, on purpose. */
:root{
  --bg:#FAF6EF; --surface:#FFFFFF; --ink:#24211E; --muted:#5C564F; --line:#ECE4D7; --soft:#F2ECE2;
  --accent:#3F5C8E; --powder:#DCE6F5; --powder-2:#EEF3FA; --gold:#9E7744; --on-accent:#FFFFFF;
  --wash:#E8EFF9; --candle:#B48B57; --slip:#B4533F; --robe:#2E2826; --bone:#F4ECDC;
  --heat0:#EEE7DB; --heat1:#C9D8EF; --heat2:#8FA9D6; --heat3:#3F5C8E; --heat-slip:#E6AE9F; --heat-freeze:#EBD2A3;
  --shadow:0 1px 2px rgba(70,50,30,.05),0 14px 34px -16px rgba(70,50,30,.2);
  --shadow-lg:0 2px 4px rgba(70,50,30,.05),0 24px 60px -20px rgba(70,50,30,.28);
  --display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --body:'Jost','Futura','Avenir Next',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16.5px;line-height:1.6;font-weight:400;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--display);font-optical-sizing:auto;text-wrap:balance;font-weight:500;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* shell */
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,#FFFFFF 0%,#F7F2EA 100%);border-right:1px solid var(--line);
  padding:32px 22px 24px max(22px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:var(--ink)}
.brand .b-sm{font-family:var(--display);font-style:italic;font-size:22px;color:var(--muted)}
.brand .b-lg{font-family:var(--display);font-style:italic;font-weight:700;font-size:42px;letter-spacing:-.03em;line-height:1}
.side-tag{font-size:14px;color:var(--muted);margin-top:-16px}
.side nav{display:flex;flex-direction:column;gap:4px}
.side nav a{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 14px;border-radius:14px;color:var(--muted);text-decoration:none;font-size:15px;transition:background .2s,color .2s}
.side nav a:hover{background:var(--powder-2);color:var(--ink)}
.side nav a[aria-current="page"]{background:var(--powder);color:var(--ink);font-weight:500}
.side nav svg{flex:0 0 auto}
.side-foot{margin-top:auto;background:var(--powder-2);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.side-foot strong{font-family:var(--display);font-style:italic;font-size:34px;line-height:1}
.topbar{display:none}
.main{min-width:0;padding:40px max(36px,env(safe-area-inset-right,0px)) 72px 40px}
.app{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.navscrim{position:fixed;inset:0;z-index:60;background:rgba(40,30,20,.22)}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:70;transform:translateX(-105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow-lg);
    padding-top:calc(28px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .side.open{transform:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(250,246,239,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));justify-content:space-between;align-items:center}
  .topbar .brand .b-lg{font-size:30px}.topbar .brand .b-sm{font-size:17px}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
  .main{padding:22px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
}

/* type helpers */
.eyebrow{font-size:12px;letter-spacing:.2em;font-weight:500;text-transform:uppercase;color:var(--gold)}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums lining-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.page-title{display:flex;flex-direction:column;gap:6px}
.page-title .script{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:500}
.page-title h1{font-size:clamp(36px,5vw,50px);line-height:1.05;font-weight:500}
.page-title h1 em{font-style:italic}
.page-title p{color:var(--muted);max-width:60ch}
.word{display:flex;align-items:baseline;gap:10px;line-height:1}
.word .script{font-family:var(--display);font-style:italic;font-size:30px;color:var(--muted)}
.word b{font-family:var(--display);font-style:italic;font-weight:700;font-size:60px;letter-spacing:-.03em}

/* buttons */
.btn{min-height:48px;padding:0 24px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);
  font-size:13px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;
  transition:background .2s,border-color .2s,transform .2s,box-shadow .2s}
.btn:hover{border-color:#D8CDBB;box-shadow:var(--shadow);transform:translateY(-1px)}
.btn.primary{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent)}
.btn.small{min-height:44px;padding:0 18px;font-size:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:none;padding:0;min-height:44px;cursor:pointer;color:var(--accent);text-decoration:underline;text-underline-offset:4px;text-decoration-color:var(--powder);font-size:15px;display:inline-flex;align-items:center;gap:6px}
.icon-btn{width:44px;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--ink)}

/* cards + grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.span{grid-column:1/-1}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid rgba(236,228,215,.8);border-radius:24px;padding:26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0}
.card.wash{background:linear-gradient(145deg,#E4ECF8 0%,#F5F1EA 100%);border-color:transparent}
.card.quiet{background:var(--surface)}
@media (max-width:520px){.card{padding:20px;border-radius:20px}}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-h h2{font-size:24px}
.hero-card{border-radius:30px;padding:34px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:34px;align-items:center;box-shadow:var(--shadow);
  background:radial-gradient(60% 90% at 0% 0%,#DCE6F5 0%,transparent 70%),radial-gradient(50% 80% at 100% 100%,#F3E6D2 0%,transparent 70%),#FFFFFF;border:1px solid rgba(236,228,215,.8)}
.hero-card .big{font-family:var(--display);font-style:italic;font-weight:600;font-size:clamp(110px,16vw,168px);line-height:.8;letter-spacing:-.05em;color:var(--accent)}
.hero-card h2{font-size:clamp(26px,3.4vw,34px);font-style:italic;font-weight:400;line-height:1.15}
@media (max-width:560px){.hero-card{grid-template-columns:minmax(0,1fr);gap:16px;padding:26px 22px}}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat strong{font-family:var(--display);font-size:32px;line-height:1.05;font-weight:500}
.bar{height:6px;border-radius:99px;background:rgba(36,33,30,.08);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8FA9D6,var(--accent));border-radius:99px}

/* items */
.item{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none;padding-top:4px}
.item .name{font-family:var(--display);font-style:italic;font-size:21px;line-height:1.2}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:0 12px;border-radius:99px;background:var(--soft);font-size:12px;letter-spacing:.04em;color:var(--muted)}
.chip.go{background:var(--powder);color:var(--accent)}
.chip.ex{background:transparent;border:1px dashed #D9CFBE}
.reason{font-family:var(--display);font-style:italic;color:var(--muted)}

/* heatmap */
.heat{display:grid;grid-template-rows:repeat(7,minmax(0,1fr));grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:5px}
.heat i{aspect-ratio:1;border-radius:5px;border:1px dashed var(--line);max-width:100%}
.heat i.h0{background:var(--heat0);border:none}.heat i.h1{background:var(--heat1);border:none}.heat i.h2{background:var(--heat2);border:none}.heat i.h3{background:var(--heat3);border:none}
.heat i.slip{background:var(--heat-slip);border:none}.heat i.freeze{background:var(--heat-freeze);border:none}
.heat i.today{outline:2px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* forms */
label{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.14em;font-weight:500;text-transform:uppercase;color:var(--muted)}
input,select,textarea{min-height:50px;border-radius:14px;border:1px solid var(--line);background:#FFFDFA;padding:12px 16px;font-size:16px;text-transform:none;letter-spacing:normal;font-weight:400;color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:#9FB6DD;box-shadow:0 0 0 4px var(--powder-2);outline:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:420px){.grid2{grid-template-columns:minmax(0,1fr)}}
.hint{font-size:14px;color:var(--muted);text-transform:none;letter-spacing:normal;font-weight:400}
.hint.warn{color:var(--slip)}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.seg label{position:relative;min-height:46px;border:1px solid var(--line);border-radius:14px;display:grid;place-items:center;font-size:13px;letter-spacing:.04em;text-transform:none;cursor:pointer;color:var(--ink);background:#FFFDFA}
.seg label:has(input:checked){background:var(--powder);border-color:#B9CBE8;color:var(--accent);font-weight:500}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding-right:4px}
.msg{max-width:85%;padding:12px 16px;border-radius:20px;font-size:15px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.coach{background:var(--powder-2);border-bottom-left-radius:6px;align-self:flex-start}
.msg.me{background:var(--ink);color:#FFFFFF;border-bottom-right-radius:6px;align-self:flex-end}
.verdict{font-family:var(--display);font-style:italic;font-size:21px}

/* graveyard: arched headstones in soft stone */
.obits{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:22px}
.obit{background:linear-gradient(180deg,#FFFFFF 0%,#F6F1E8 100%);border:1px solid rgba(236,228,215,.9);border-radius:120px 120px 20px 20px;padding:42px 22px 24px;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;box-shadow:var(--shadow);animation:rise .7s cubic-bezier(.2,.9,.25,1.1) both}
.obit-h{display:flex;flex-direction:column;align-items:center;gap:4px}
.obit h3{font-style:italic;font-weight:400;font-size:23px;line-height:1.15;overflow-wrap:anywhere}
.obit .pr{font-family:var(--display);font-weight:600;font-size:22px;color:var(--accent)}
.obit-meta{font-size:12px;letter-spacing:.08em;color:var(--muted)}
.obit .reason{font-size:14px}
@keyframes rise{from{transform:translateY(18px)}to{transform:none}}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px}
.filters button{flex:0 0 auto;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:14px;color:var(--ink)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#FFFFFF;border-color:var(--ink)}
.barcode{display:block;width:100%;height:34px;color:var(--ink)}
.scan{position:relative;overflow:hidden;border-radius:4px}
.scan::after{content:"";position:absolute;top:-2px;bottom:-2px;left:0;width:3px;background:var(--gold);box-shadow:0 0 12px var(--gold);animation:scan 3.4s ease-in-out infinite alternate}
@keyframes scan{from{left:0}to{left:calc(100% - 3px)}}

/* challenges */
.chal{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.chal:first-child{border-top:none;padding-top:0}
.chal h3{font-size:20px}
.badges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.badge{border:1px dashed #DCD2C1;border-radius:20px;padding:18px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;align-items:center}
.badge.on{border:1px solid transparent;background:linear-gradient(145deg,#E4ECF8,#F5F1EA);box-shadow:var(--shadow)}
.badge strong{font-family:var(--display);font-style:italic;font-size:32px;line-height:1}
.badge span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

/* sheet, toast */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(40,30,20,.28);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:26px 26px 0 0;box-shadow:var(--shadow-lg);
  padding:26px max(22px,env(safe-area-inset-left,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:26px}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:#FFFFFF;padding:12px 20px;border-radius:99px;font-size:14px;max-width:calc(100% - 32px);text-align:center;box-shadow:var(--shadow-lg)}
.copybox{font-size:15px;background:var(--powder-2);border-radius:16px;padding:14px 16px;user-select:all;overflow-wrap:anywhere}
body[data-view="ask"] .app,body[data-view="setup"] .app,body[data-view="welcome"] .app{max-width:720px}
.welcome{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}

/* profile + wizard */
.fs{border:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.fs legend{font-family:var(--display);font-size:20px;font-style:italic;padding:0;margin-bottom:10px}
.fs legend .hint{font-family:var(--body);font-style:normal;font-size:13px;margin-left:6px}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chipset label{position:relative;flex-direction:row;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:99px;display:inline-flex;align-items:center;font-size:14px;letter-spacing:.01em;text-transform:none;font-weight:400;color:var(--ink);background:#FFFDFA;cursor:pointer;transition:background .15s,border-color .15s}
.chipset input,.opts input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;min-height:0}
.chipset label:has(input:checked){background:var(--powder);border-color:#B9CBE8;color:var(--accent);font-weight:500}
.chipset label:has(input:focus-visible),.opts label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.sentence{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-family:var(--display);font-size:19px;font-style:italic}
.sentence input{flex:1 1 180px;width:auto;font-family:var(--body);font-style:normal}
.range-row{display:flex;align-items:center;gap:16px;margin-top:4px}
.range-row input{flex:1;min-height:44px;padding:0;border:none;background:none;box-shadow:none;accent-color:var(--accent)}
.range-row output{font-family:var(--display);font-size:26px;text-transform:none;letter-spacing:0;color:var(--ink);min-width:80px;text-align:right}
label.check{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:normal;font-size:15px;color:var(--ink);font-weight:400;cursor:pointer}
label.check input{width:22px;min-height:22px;height:22px;accent-color:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opts.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opts label{position:relative;flex-direction:column;align-items:flex-start;gap:4px;padding:16px;border:1px solid var(--line);border-radius:18px;background:#FFFDFA;cursor:pointer;text-transform:none;letter-spacing:normal;color:var(--ink)}
.opts label strong{font-family:var(--display);font-size:18px;font-weight:500}
.opts label:has(input:checked){background:var(--powder-2);border-color:#9FB6DD;box-shadow:0 0 0 3px var(--powder-2)}
.pcard{background:radial-gradient(70% 90% at 0% 0%,#E4ECF8 0%,transparent 70%),radial-gradient(60% 80% at 100% 100%,#F4E9D8 0%,transparent 70%),#FFFFFF}
.p-top{display:flex;align-items:center;gap:18px}
.avatar{width:68px;height:68px;flex:0 0 auto;border-radius:50%;background:linear-gradient(145deg,#C9D8EF,#F1E2CB);display:grid;place-items:center;font-family:var(--display);font-size:26px;font-style:italic;color:var(--accent);box-shadow:inset 0 0 0 3px #FFFFFF,var(--shadow)}
.pquote{font-family:var(--display);font-style:italic;font-size:19px;line-height:1.4;color:var(--ink);padding-left:14px;border-left:3px solid var(--powder)}
.plist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:4px 0 0}
@media (max-width:520px){.plist{grid-template-columns:minmax(0,1fr)}}
.plist div{display:flex;flex-direction:column;gap:2px;min-width:0}
.plist dt{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500}
.plist dd{margin:0;font-size:15px;overflow-wrap:anywhere}

/* streak calendar */
.cal{display:flex;flex-direction:column;gap:16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head h3{font-size:24px;font-style:italic;font-weight:500}
.cal-head .icon-btn[disabled]{opacity:.3;cursor:default}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:8px}
.dow{text-align:center;font-size:11px;letter-spacing:.16em;color:var(--gold);font-weight:500;padding-bottom:4px}
.cd{position:relative;aspect-ratio:1/1;max-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:16px;font-size:15px;color:var(--muted);transition:transform .15s}
.cd .dn{position:relative;z-index:1}
.cd.empty{visibility:hidden}
.cd.future,.cd.before{color:#B8AFA2}
.cd.clean{background:linear-gradient(160deg,#E8EFFA,#D4E1F4);color:var(--accent);font-weight:500}
.cd.clean.rl{border-top-left-radius:0;border-bottom-left-radius:0}
.cd.clean.rr{border-top-right-radius:0;border-bottom-right-radius:0}
.cd.slip{background:#FBEDE8;color:var(--slip)}
.cd.freeze{background:linear-gradient(160deg,#FBF3E3,#F2E2C2);color:var(--gold)}
.cd.today{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--gold);z-index:2}
.cd.today .dn{font-weight:600;color:var(--ink)}
.cd:hover{transform:translateY(-1px)}
.cd .dots{display:flex;gap:3px;position:relative;z-index:1}
.cd .dots i{width:5px;height:5px;border-radius:50%;background:var(--accent)}

.cal-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-top:14px;border-top:1px solid var(--line)}
.cal-stats div{display:flex;flex-direction:column;gap:2px;min-width:0}

.legend .lg{width:14px;height:14px;border-radius:5px;display:inline-block}
.lg.clean{background:linear-gradient(160deg,#E8EFFA,#D4E1F4)}

.lg.freeze{background:#F2E2C2}

@media (max-width:520px){.cd{border-radius:12px;font-size:13px}.cal-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.cd .dots i{width:4px;height:4px}}

/* screenshot upload */
.shot-drop{position:relative;flex-direction:row;align-items:center;gap:14px;padding:14px 16px;border:1.5px dashed #C9D6EC;border-radius:20px;background:var(--powder-2);cursor:pointer;text-transform:none;letter-spacing:normal;color:var(--ink);font-weight:400;transition:border-color .2s,background .2s}

.shot-thumb{width:48px;height:64px;flex:0 0 auto;object-fit:cover;border-radius:10px;box-shadow:var(--shadow)}

/* small motion */
.glow{animation:glow 1.8s ease-in-out infinite alternate}
@keyframes glow{from{opacity:.25}to{opacity:.6}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.1s ease-in-out infinite alternate}
@keyframes flicker{0%{transform:scale(1,1) skewX(0)}30%{transform:scale(.9,1.1) skewX(4deg)}65%{transform:scale(1.06,.94) skewX(-3deg)}100%{transform:scale(.96,1.05) skewX(1deg)}}
.candles{display:inline-flex;align-items:flex-end;gap:2px}
.serve{animation:serve 1s cubic-bezier(.2,1.25,.4,1) both}
@keyframes serve{from{transform:translateX(-50px)}to{transform:none}}
.lid{transform-box:fill-box;transform-origin:100% 100%;animation:lid 3.6s ease-in-out infinite}
@keyframes lid{0%,35%,75%,100%{transform:rotate(0)}50%,62%{transform:rotate(-22deg)}}
.nod{transform-box:fill-box;transform-origin:50% 100%;animation:nod 2.6s ease-in-out infinite}
@keyframes nod{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(1.6px)}90%{transform:translateY(-.6px)}}
.council .arms{animation:tap 4s ease-in-out infinite}
@keyframes tap{0%,88%,100%{transform:translateY(0)}92%{transform:translateY(-1.2px)}96%{transform:translateY(.4px)}}
@keyframes ring{0%,100%{opacity:.3}50%{opacity:1}}
.council{display:block;width:100%;max-width:260px;height:auto;margin:4px auto 0}
.sil{display:block;height:auto}
.sil .tail-slow{transform-box:fill-box;transform-origin:0% 100%;animation:swish 6s ease-in-out infinite}
.sil .slit{transform-box:fill-box;transform-origin:center;animation:blink 7s infinite}
@keyframes swish{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,46%,52%,100%{transform:scaleY(1)}49%{transform:scaleY(.1)}}

/* burial moment, light */
.ripov{position:fixed;inset:0;z-index:95;display:grid;place-items:center;background:rgba(250,246,239,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--ink);animation:fadein .25s ease-out;cursor:pointer;padding:24px}
@keyframes fadein{from{opacity:0}to{opacity:1}}

  display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow-lg);animation:stoneup .9s cubic-bezier(.2,1.3,.4,1) both}
@keyframes stoneup{from{transform:translateY(100px) scale(.8)}to{transform:none}}

.ripov .say{font-family:var(--display);font-style:italic;font-size:40px;line-height:1;color:var(--accent);animation:fadein .6s .45s both}

/* loading page */
.ed-stack{display:flex;flex-direction:column;align-items:flex-start;line-height:.88}
.ed-sm{font-family:var(--display);font-style:italic;font-size:30px;color:#9A938A}
.ed-md{font-family:var(--display);font-style:italic;font-size:46px;padding-left:28px}
.ed-lg{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(52px,16vw,76px);letter-spacing:-.035em;padding-left:22px;color:var(--accent)}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);display:grid;place-items:center;
  padding:max(24px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));transition:opacity .55s ease,transform .55s ease}
.splash.out{opacity:0;transform:scale(1.02);pointer-events:none}
.splash-in{width:100%;max-width:380px;display:flex;flex-direction:column;gap:18px}
.splash .ed-stack>*{animation:edin .8s cubic-bezier(.2,.8,.2,1) both}
.splash .ed-stack>*:nth-child(2){animation-delay:.12s}.splash .ed-stack>*:nth-child(3){animation-delay:.24s}.splash .ed-stack>*:nth-child(4){animation-delay:.36s}
@keyframes edin{from{transform:translateY(16px)}to{transform:none}}
.ldbars{display:flex;align-items:stretch;gap:2px;height:44px}
.ldbars i{flex:0 0 auto;background:var(--ink);transform-origin:bottom;animation:barup .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.lddigits{font-family:var(--display);letter-spacing:.32em;font-size:14px;display:flex;justify-content:space-between}
.tray-wrap{display:flex;justify-content:flex-start;margin-left:-6px}

<script>
(() => {
"use strict";
const D = 86400000, H = 3600000;
const CATS = ["Makeup","Clothes","Home","Other"];
const CHALLENGES = [
  {id:"nobuy7",  name:"7-Day No-Buy", blurb:"One week, zero impulse buys.", days:7, cats:null},
  {id:"closet",  name:"Shop Your Closet Week", blurb:"No new clothes. Restyle what you own.", days:7, cats:["Clothes"]},
  {id:"nomakeup",name:"No Makeup November", blurb:"Thirty days without new makeup.", days:30, cats:["Makeup"]},
  {id:"useitup", name:"Use It Up Month", blurb:"Finish what you have before buying makeup or home things.", days:30, cats:["Makeup","Home"]},
  {id:"nobuy30", name:"30-Day No-Buy", blurb:"A full month of keeping your money.", days:30, cats:null},
  {id:"nobuy90", name:"90-Day No-Buy", blurb:"The big one. A whole season.", days:90, cats:null}
];

/* ---------- helpers ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => { n = Number(n)||0; return "$" + n.toLocaleString(undefined,{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2}); };
const pad = n => String(n).padStart(2,"0");
const dayKey = (d = new Date()) => { const x = new Date(d); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); };
const parseDay = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y,m-1,d); };
const daysBetween = (a,b) => Math.round((parseDay(b)-parseDay(a))/D);
const addDays = (k,n) => { const d = parseDay(k); d.setDate(d.getDate()+n); return dayKey(d); };
const today = () => dayKey();
const fmt = ms => new Date(ms).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtDay = k => parseDay(k).toLocaleDateString(undefined,{month:"short",day:"numeric"});
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const plural = (n,w) => n + " " + w + (n === 1 ? "" : "s");
const left = ms => { if (ms <= 0) return "ready now"; const h = Math.floor(ms/H), m = Math.ceil((ms%H)/60000); return h >= 24 ? "ready in " + plural(Math.ceil(ms/D),"day") : h ? `ready in ${h}h ${m}m` : `ready in ${m}m`; };

/* ---------- state ---------- */
const fresh = () => ({v:1, settings:{buddy:"", limit:25, waitHours:24, goalName:"", goalAmount:150},
  profile:{}, startedAt:null, streakStart:null, best:0, slips:[], freezes:{}, items:[], challenge:null, history:[], claimed:0, claims:[], exampleMode:false});
let S = fresh();
let mode = "loading"; // loading | cloud | device
let docRef = null, saveTimer = null;
let sampleFn = null, coachOff = false, imgOK = false;
let view = "home";
let gFilter = "All";
let ask = {step:"form", draft:null, chat:null, shot:null};
let sheet = null; // {type:'slip', ...}

const normalize = o => { const f = fresh(); const s = Object.assign(f, o || {}); s.settings = Object.assign(fresh().settings, (o||{}).settings || {}); s.items = s.items || []; s.slips = s.slips || []; s.freezes = s.freezes || {}; s.history = s.history || []; s.claims = s.claims || []; s.profile = s.profile || {}; return s; };

function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const body = JSON.parse(JSON.stringify(S));
    if (mode === "cloud" && docRef){
      try { await docRef.set(body); }
      catch(e){
        if (e && e.code === "unavailable"){ setTimeout(() => docRef.set(body).catch(() => toast("Couldn't save. Check your connection.")), 1500); }
        else toast("Couldn't save that change. Try again in a moment.");
      }
    } else {
      try { localStorage.setItem("herelies-v1", JSON.stringify(body)); } catch(e){}
    }
  }, 350);
}

async function initStore(){
  try {
    const c = window.claude;
    if (c && c.use){
      const user = await c.use("user");
      const id = user ? await user.id() : null;
      const db = await c.use("db");
      if (db && id){
        docRef = db.doc("data/users/" + id + "/app");
        const snap = await docRef.get();
        if (snap.exists) S = normalize(JSON.parse(JSON.stringify(snap.data())));
        mode = "cloud";
      }
      c.use("sample").then(fn => { sampleFn = fn; if (fn && fn.limits) fn.limits().then(l => { imgOK = !!(l && l.images); if (view === "ask") render(); }).catch(() => {}); if (view === "ask") render(); }).catch(() => {});
    }
  } catch(e){}
  if (mode !== "cloud"){
    mode = "device";
    try { const raw = localStorage.getItem("herelies-v1"); if (raw) S = normalize(JSON.parse(raw)); } catch(e){}
  }
  render(); hideSplash(); if (view === "home") setTimeout(countUp, Math.max(0, 1900 - (performance.now() - splashStart)));
}

/* ---------- derived ---------- */
const streak = () => S.streakStart ? Math.max(0, daysBetween(S.streakStart, today())) : 0;
const monthKey = () => today().slice(0,7);
const freezeLeft = () => !(S.freezes[monthKey()] >= 1);
const buried = () => S.items.filter(i => i.status === "buried");
const saved = () => buried().reduce((a,i) => a + (Number(i.price)||0), 0);
const fund = () => Math.max(0, saved() - (S.claimed||0));
const isReady = i => i.status === "waiting" && Date.now() >= i.readyAt;
const needsYou = () => S.items.filter(i => isReady(i) || i.status === "buddy" || i.status === "approved");
const waiting = () => S.items.filter(i => i.status === "waiting" && !isReady(i)).sort((a,b) => a.readyAt-b.readyAt);
const resurrectable = () => buried().filter(i => !i.revisited && Date.now() - (i.decidedAt||0) >= 30*D);
const chal = id => CHALLENGES.find(c => c.id === id);
const buddyName = () => S.settings.buddy || "your buddy";

function housekeeping(){
  let changed = false;
  const s = streak();
  if (s > (S.best||0)){ S.best = s; changed = true; }
  if (S.challenge){
    const c = chal(S.challenge.id);
    if (c && daysBetween(S.challenge.start, today()) >= c.days){
      S.history.push({id:c.id, start:S.challenge.start, end:today(), result:"won"});
      S.challenge = null; changed = true;
      setTimeout(() => toast(c.name + " complete. Badge earned."), 300);
    }
  }
  if (changed) save();
}

/* ---------- graphics ---------- */
function reaperInner(stroke = "var(--ink)", robe = "var(--robe)"){
  return `<g class="r-bob"><g class="r-scythe"><line x1="16" y1="14" x2="16" y2="92" stroke="#8A5A34" stroke-width="4" stroke-linecap="round"/>
    <path d="M16 16 Q36 4 50 20 Q34 14 18 24 Z" fill="#F4ECDC" stroke="${stroke}" stroke-width="1.5"/></g>
    <path d="M24 92 Q22 54 34 38 Q50 18 66 38 Q78 54 76 92 Z" fill="${robe}" stroke="${stroke}" stroke-width="1.8"/>
    <ellipse cx="51" cy="50" rx="15" ry="14" fill="#F4ECDC"/>
    <g class="blink"><ellipse cx="45" cy="50" rx="4.5" ry="5.5" fill="#1B1A19"/><ellipse cx="57" cy="50" rx="4.5" ry="5.5" fill="#1B1A19"/></g>
    <path d="M48 58 Q51 61 54 58" stroke="#1B1A19" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`;
}
function reaper(size = 64, extra = ""){
  return `<svg class="reaper ${extra}" width="${size}" height="${Math.round(size*1.2)}" viewBox="0 -6 80 102" role="img" aria-label="Little reaper mascot">${reaperInner()}</svg>`;
}
function catSvg(x, y, s = 1.3){
  return `<g transform="translate(${x},${y}) scale(${s})">
    <path class="tail" d="M9 -2 C20 -2 23 -12 18 -19 C15 -23 10 -20 12 -16" stroke="#0B0913" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M-11 0 C-13 -10 -9 -20 0 -21 C9 -20 13 -10 11 0 Z" fill="#0B0913"/>
    <circle cx="0" cy="-26" r="8" fill="#0B0913"/>
    <path d="M-7.5 -29 L-6.5 -38 L-1.5 -32 Z M7.5 -29 L6.5 -38 L1.5 -32 Z" fill="#0B0913"/>
    <g class="blink"><ellipse cx="-3.2" cy="-26.5" rx="1.7" ry="2" fill="#F1D27A"/><ellipse cx="3.2" cy="-26.5" rx="1.7" ry="2" fill="#F1D27A"/></g></g>`;
}
function batSvg(y, dur, delay, s = 1){
  return `<g class="bat" style="animation-duration:${dur}s;animation-delay:${delay}s"><g class="bob" style="animation-delay:${delay/3}s"><g transform="translate(0,${y}) scale(${s})"><g class="flapper">
    <path d="M0 0 C-4 -6 -10 -7 -16 -4 C-13 -3 -12 0 -13 2 C-10 0 -7 1 -5 3 Z M0 0 C4 -6 10 -7 16 -4 C13 -3 12 0 13 2 C10 0 7 1 5 3 Z" fill="#0B0913"/>
    <ellipse cx="0" cy="1" rx="3" ry="4" fill="#0B0913"/><path d="M-2.4 -2 L-2 -5.5 L-0.6 -2.6 Z M2.4 -2 L2 -5.5 L0.6 -2.6 Z" fill="#0B0913"/></g></g></g></g>`;
}
let sceneN = 0;
function nightScene(kind){
  const id = "ns" + (++sceneN);
  const stars = [[24,22],[60,40],[98,16],[140,34],[176,12],[212,42],[238,20],[322,90],[340,24],[120,70],[190,64],[30,78]]
    .map(([x,y],n) => `<circle class="twinkle" cx="${x}" cy="${y}" r="${n%3?1.1:1.7}" fill="#F6E7C1" style="animation-delay:${(n*0.7)%3.2}s"/>`).join("");
  const grave = kind === "graveyard";
  const mx = grave ? 70 : 296, my = 48;
  const tree = `<g stroke="#0F0B1C" stroke-linecap="round" fill="none" transform="${grave ? "translate(360,0) scale(-1,1)" : ""}">
      <path d="M34 152 C38 122 30 102 38 70" stroke-width="7"/><path d="M36 98 C22 88 16 76 8 68" stroke-width="3.5"/>
      <path d="M37 86 C50 74 60 70 70 58" stroke-width="3"/><path d="M38 74 C36 60 42 50 40 38" stroke-width="2.5"/>
      <path d="M62 64 C66 56 74 54 80 50" stroke-width="1.8"/><path d="M14 72 C10 64 12 58 6 52" stroke-width="1.6"/></g>`;
  const stones = grave ? [[132,140,"R.I.P"],[178,134,""],[222,141,"R.I.P"]].map(([x,y,t]) =>
      `<g transform="translate(${x},${y})"><path d="M-12 14 V-6 A12 12 0 0 1 12 -6 V14 Z" fill="#2E2850" stroke="#8A7FC0" stroke-width="1.2"/>${t ? `<text x="0" y="2" text-anchor="middle" font-family="Bodoni Moda,Georgia,serif" font-size="6" font-weight="700" fill="#C9BFEA" letter-spacing=".5">${t}</text>` : `<path d="M0 -4 V8 M-4 0 H4" stroke="#8A7FC0" stroke-width="1.4"/>`}</g>`).join("")
    : `<g fill="none" stroke="#0F0B1C" stroke-width="2">${[150,164,178,192,206].map(x => `<path d="M${x} 150 V128 L${x+3} 124 L${x+6} 128 V150"/>`).join("")}<path d="M146 134 H214 M146 144 H214"/></g>`;

  while (x < 296){ h = Math.imul(h ^ (h>>>13), 1274126177)>>>0; const w = 1 + (h % 4); const gap = 1 + ((h>>>5) % 3); rects += `<rect x="${x}" y="0" width="${w}" height="34" fill="currentColor"/>`; x += w + gap; }
  return `<svg class="barcode" viewBox="0 0 300 34" preserveAspectRatio="none" aria-hidden="true">${rects}</svg>`;
}

let calOffset = 0;
function dayInfo(){
  const slipBy = {}; S.slips.forEach(x => { if (!x.freeze) slipBy[x.date] = (slipBy[x.date]||[]).concat(x); else if (!slipBy[x.date]) slipBy[x.date] = "freeze"; });
  const buryBy = {}; buried().forEach(i => { const k = dayKey(i.decidedAt); (buryBy[k] = buryBy[k] || []).push(i); });
  return {slipBy, buryBy};
}
function dayState(k, info){
  const t = today();
  if (k > t) return "future";
  if (!S.startedAt || k < S.startedAt) return "before";
  const sl = info.slipBy[k];
  if (sl === "freeze") return "freeze";
  if (sl) return "slip";
  return "clean";
}
function heatmap(){
  const info = dayInfo(), t = today();
  const base = parseDay(t); base.setDate(1); base.setMonth(base.getMonth() + calOffset);
  const y = base.getFullYear(), m = base.getMonth();
  const monthName = base.toLocaleDateString(undefined,{month:"long", year:"numeric"});
  const firstDow = new Date(y, m, 1).getDay(), dim = new Date(y, m+1, 0).getDate();
  const dows = Array.from({length:7}, (_,i) => new Date(2026,1,1+i).toLocaleDateString(undefined,{weekday:"narrow"}));
  let cells = "", clean = 0, kept = 0, buriedN = 0, slips = 0;
  for (let i = 0; i < firstDow; i++) cells += `<span class="cd empty" aria-hidden="true"></span>`;
  for (let d = 1; d <= dim; d++){
    const k = y + "-" + pad(m+1) + "-" + pad(d), st = dayState(k, info), b = info.buryBy[k] || [];
    const prev = dayState(addDays(k,-1), info), next = dayState(addDays(k,1), info);
    const runL = st === "clean" && (prev === "clean" || prev === "freeze") && d > 1 && (d - 1 + firstDow) % 7 !== 0;
    const runR = st === "clean" && (next === "clean" || next === "freeze") && d < dim && (d + firstDow) % 7 !== 0;
    if (st === "clean"){ clean++; } if (st === "slip") slips++;
    buriedN += b.length; kept += b.reduce((a,i) => a + (Number(i.price)||0), 0);
    let label = parseDay(k).toLocaleDateString(undefined,{weekday:"long", month:"long", day:"numeric"}) + ": ";
    label += st === "future" ? "upcoming" : st === "before" ? "before you started" : st === "slip" ? "bought something" : st === "freeze" ? "freeze used" : b.length ? `clean, ${plural(b.length,"impulse")} let go` : "clean";
    cells += `<span class="cd ${st}${runL?" rl":""}${runR?" rr":""}${k===t?" today":""}" title="${esc(label)}" aria-label="${esc(label)}">
      <span class="dn num">${d}</span>${b.length ? `<span class="dots">${b.slice(0,3).map(() => "<i></i>").join("")}</span>` : st === "slip" ? `<span class="mk">×</span>` : st === "freeze" ? `<span class="mk">❄︎</span>` : ""}</span>`;
  }
  const canNext = calOffset < 0, startD = S.startedAt ? parseDay(S.startedAt) : null;
  const canPrev = startD ? (startD.getFullYear() < y || (startD.getFullYear() === y && startD.getMonth() < m)) : false;
  return `<div class="cal">
    <div class="cal-head"><button class="icon-btn" type="button" data-act="calPrev" aria-label="Previous month" ${canPrev?"":"disabled"}>${icon.back}</button>
      <h3>${esc(monthName)}</h3>
      <button class="icon-btn" type="button" data-act="calNext" aria-label="Next month" ${canNext?"":"disabled"}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button></div>
    <div class="cal-grid" role="grid" aria-label="${esc(monthName)} streak calendar">${dows.map(w => `<span class="dow" aria-hidden="true">${w}</span>`).join("")}${cells}</div>
    <div class="cal-stats">
      <div><strong class="num">${clean}</strong><span>clean days</span></div>
      <div><strong class="num">${buriedN}</strong><span>let go</span></div>
      <div><strong class="num">${money(kept)}</strong><span>kept</span></div>
      <div><strong class="num">${slips}</strong><span>${slips === 1 ? "slip" : "slips"}</span></div>
    </div>
    <div class="legend"><span><i class="lg clean"></i>Clean day</span><span><i class="lg dot"></i>Let something go</span><span><i class="lg slip"></i>Bought</span><span><i class="lg freeze"></i>Freeze</span><span><i class="lg today"></i>Today</span></div>
  </div>`;
}

  {v:"gentle", t:"Gentle", d:"Warm and encouraging. Soft questions, no pressure."},

let wiz = null;

function startWizard(edit){

    name:"", birthMonth:"", reasons:[], stopWhat:"", because:"", weak:[], weakOther:"", places:[], times:[], triggers:[],

const chipset = (name, opts, sel, label) => `<div class="chipset" role="group" aria-label="${esc(label)}">${opts.map((o,n) =>
  `<label for="w-${name}-${n}"><input id="w-${name}-${n}" type="checkbox" name="${name}" value="${esc(o)}" ${(sel||[]).includes(o) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div>`;
const listText = arr => { arr = (arr||[]).filter(Boolean); return arr.length <= 1 ? (arr[0]||"") : arr.slice(0,-1).join(", ") + " and " + arr[arr.length-1]; };
const initials = n => (String(n||"").trim().split(/\s+/).map(w => w[0]).join("").slice(0,2) || "·").toUpperCase();
const allWeak = P => [...(P.weak||[]), ...(P.weakOther ? P.weakOther.split(",").map(x => x.trim()).filter(Boolean) : [])];

function profileCard(P, st){
  const weak = allWeak(P).map(x => x.toLowerCase());

function wizCollect(fd){
  const d = wiz.d, st = wiz.step, g = k => String(fd.get(k) ?? "").trim();
  if (st === 0){ if (!g("name")){ toast("Add a name so we know what to call you."); return false; } d.name = g("name"); d.birthMonth = g("birthMonth"); }
  if (st === 1){ d.reasons = fd.getAll("reasons"); d.stopWhat = g("stopWhat"); d.because = g("because"); d.goalName = g("goalName"); d.goalAmount = Math.max(0, Number(g("goalAmount"))||0); }
  if (st === 2){ d.weak = fd.getAll("weak"); d.weakOther = g("weakOther"); d.places = fd.getAll("places"); d.times = fd.getAll("times"); d.triggers = fd.getAll("triggers"); }
  if (st === 3){ d.monthlyFun = Number(g("monthlyFun"))||0; d.limit = Math.max(0, Number(g("limit"))||0); d.waitHours = Number(g("waitHours"))||24; d.longerWait = fd.get("longerWait") === "on"; }
  if (st === 4){ d.buddy = g("buddy"); d.buddyRel = g("buddyRel"); d.buddyHow = g("buddyHow"); d.buddyMsg = g("buddyMsg") || DEFAULT_MSG; }
  if (st === 5){ d.tone = g("tone") || "honest"; d.nudge = g("nudge") || "soft"; }
  return true;
}
function wizFinish(){
  const d = wiz.d, keys = ["name","birthMonth","reasons","stopWhat","because","weak","weakOther","places","times","triggers","monthlyFun","longerWait","buddyRel","buddyHow","buddyMsg","tone","nudge"];
  S.profile = {}; keys.forEach(k => S.profile[k] = d[k]);
  Object.assign(S.settings, {buddy:d.buddy, limit:Number(d.limit)||0, waitHours:Number(d.waitHours)||24, goalName:d.goalName, goalAmount:Number(d.goalAmount)||0});
  const first = !S.startedAt;
  if (first){ S.startedAt = today(); S.streakStart = today(); S.exampleMode = false; }
  wiz = null; save(); location.hash = "home"; render(); toast(first ? `Welcome, ${d.name}. Night one starts now.` : "Profile saved.");
}

/* how the profile shapes the rest of the site */
const CAT_WEAK = {Makeup:["Makeup","Skincare"], Clothes:["Clothes","Shoes","Bags"], Home:["Home decor","Candles"], Other:["Tech","Books","Takeout","Amazon finds","Collectibles"]};
const isWeakCat = cat => { const P = S.profile || {}; return (CAT_WEAK[cat]||[]).some(w => (P.weak||[]).includes(w)); };
const waitFor = d => (Number(S.settings.waitHours)||24) + ((S.profile||{}).longerWait && isWeakCat(d.cat) ? 24 : 0);
const lateRisk = () => { const h = new Date().getHours(); return ((S.profile||{}).times||[]).includes("Late at night") && (h >= 22 || h < 4); };
function spentThisMonth(){
  const m = monthKey();
  return S.slips.filter(s => s.date.slice(0,7) === m).reduce((a,s) => a + (Number(s.price)||0), 0)
    + S.items.filter(i => i.status === "bought" && i.planned && dayKey(i.decidedAt).slice(0,7) === m).reduce((a,i) => a + (Number(i.price)||0), 0);
}

/* ---------- screenshot reading ---------- */
function shotBlock(){
  const sh = ask.shot;
  return `<div class="shot">
    <label class="shot-drop" for="a-shot">
      <input id="a-shot" type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-shot>
      ${sh && sh.url ? `<img class="shot-thumb" src="${sh.url}" alt="Your screenshot">` : `<span class="shot-ic" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 15l-5-5-8 9"/></svg></span>`}
      <span class="stack" style="gap:2px;min-width:0">
        <strong>${sh && sh.busy ? "Reading your screenshot…" : sh && sh.found ? "Filled in from your screenshot" : "Upload a screenshot"}</strong>
        <span class="hint">${sh && sh.err ? `<span class="warn">${esc(sh.err)}</span>` : sh && sh.found ? `Check it over${sh.found.store ? " · spotted on " + esc(sh.found.store) : ""}. Tap to use a different one.` : "From TikTok, Instagram or any store. We’ll read the product and price."}</span>
      </span>
    </label>
  </div>`;
}
function grabAskForm(){
  const f = document.querySelector('form[data-form="ask"]'); if (!f) return;
  const fd = new FormData(f), g = k => String(fd.get(k) ?? "");
  ask.draft = Object.assign({}, ask.draft || {}, {name:g("name"), price:g("price"), url:g("url"), cat:g("cat") || "Makeup", reason:g("reason")});
}
async function readShot(file){
  if (!file || !sampleFn) return;
  grabAskForm();
  if (ask.shot && ask.shot.url) try { URL.revokeObjectURL(ask.shot.url); } catch(e){}
  ask.shot = {url:URL.createObjectURL(file), busy:true};
  render();
  const prompt = `This is a screenshot of something a person is tempted to buy, taken from TikTok, Instagram, a store's website or app, or similar. Identify the main product being sold.
Reply with only JSON in exactly this shape:
{"name": string, "price": number or null, "category": "Makeup" | "Clothes" | "Home" | "Other", "store": string or null}
- name: short product name with the brand if visible, at most 60 characters, plus the shade or color if shown.
- price: the current price in dollars as a plain number (use the sale price if both are shown), or null if no price is visible.
- category: Makeup covers makeup, skincare and beauty; Clothes covers clothing, shoes, bags and accessories; Home covers decor, candles, kitchen and furniture; everything else is Other.
- store: the shop or app name if visible, else null.
Example: {"name":"Rare Beauty Soft Pinch Liquid Blush in Hope","price":23,"category":"Makeup","store":"Sephora"}`;
  try {
    const r = await sampleFn.json(prompt, {images:file, modelTier:"default"});
    const d = ask.draft || {};
    const price = r && r.price != null && isFinite(Number(String(r.price).replace(/[^0-9.]/g,""))) ? Number(String(r.price).replace(/[^0-9.]/g,"")) : null;
    ask.draft = Object.assign({}, d, {
      name: (r && typeof r.name === "string" && r.name.trim()) ? r.name.trim().slice(0,60) : d.name,
      price: price != null ? price : d.price,
      cat: r && CATS.includes(r.category) ? r.category : (d.cat || "Makeup")
    });
    ask.shot.busy = false; ask.shot.found = {store: r && typeof r.store === "string" ? r.store.slice(0,40) : ""};
    if (price == null) ask.shot.err = "No price showed in that screenshot. Add it below.";
  } catch(e){
    const code = e && e.code; ask.shot.busy = false;
    if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed","images_unavailable"].includes(code)){ imgOK = false; ask.shot = null; toast("Screenshot reading isn't available here. Fill it in yourself."); }
    else if (code === "image_rejected") ask.shot.err = "That file didn't work. Try a PNG or JPG screenshot.";
    else if (code === "invalid_json" || code === "empty_completion") ask.shot.err = "Couldn't find a product in that screenshot. Fill it in yourself.";
    else if (code === "rate_limited") ask.shot.err = "Too many tries just now. Wait a moment and try again.";
    else if (code !== "cancelled") ask.shot.err = "Couldn't read that one. Try again, or fill it in yourself.";
  }
  render();
  const n = document.getElementById(ask.draft && ask.draft.reason ? "a-name" : "a-reason"); if (n) n.focus();
}
document.addEventListener("change", e => { if (e.target.matches && e.target.matches("[data-shot]")) readShot(e.target.files && e.target.files[0]); });

function render(){

  housekeeping();
  document.body.dataset.view = (!S.startedAt && ["home","ask","challenges"].includes(v)) ? "welcome" : v;
  const sf = document.getElementById("sideFoot");
  if (sf) sf.innerHTML = S.startedAt ? `<span class="eyebrow">${esc((S.profile||{}).name || "Streak")}</span><strong class="num">${streak()}</strong><span class="hint">${streak() === 1 ? "night" : "nights"} · ${money(fund())} kept</span>` : `<span class="eyebrow">Welcome</span><span class="hint">Set up your streak to begin.</span>`;
  closeMenu();
  const html = mode === "loading" ? `<div class="welcome"><div class="word"><span class="script">Here</span><b>Lies</b></div></div>`
    : v === "home" ? vHome() : v === "ask" ? vAsk() : v === "challenges" ? vChallenges() : v === "graveyard" ? vGraveyard() : vSetup();
  document.getElementById("app").innerHTML = html;
  document.getElementById("layer").innerHTML = sheetHtml();
  document.querySelectorAll(".side nav a").forEach(a => { if (a.dataset.tab === v) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  const chat = document.getElementById("chat"); if (chat) chat.scrollTop = chat.scrollHeight;
}
function renderChat(){ const el = document.getElementById("chat"); if (el){ el.innerHTML = chatHtml(); el.scrollTop = el.scrollHeight; } }

let toastT;
function toast(msg){
  let t = document.querySelector(".toast"); if (!t){ t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status"); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800);
}

/* ---------- logic ---------- */
const routeFor = d => (Number(S.settings.limit) > 0 && Number(d.price) >= Number(S.settings.limit)) ? "buddy" : "waiting";
const buddyMsg = i => String((S.profile||{}).buddyMsg || "Hey {buddy}, can I buy \u201c{item}\u201d for {price}? My reason: \u201c{reason}\u201d. Reply YES, NO, or WAIT A WEEK.")
  .replaceAll("{buddy}", S.settings.buddy || "you").replaceAll("{item}", i.name).replaceAll("{price}", money(i.price)).replaceAll("{reason}", i.reason);
function findItem(id){ return S.items.find(i => i.id === id); }
function bury(i){ i.status = "buried"; i.decidedAt = Date.now(); save(); }
function logSlip({name, price, cat, freeze, itemId}){
  const t = today();
  S.slips.push({date:t, name, price:Number(price)||0, cat, freeze:!!freeze});
  if (freeze){ S.freezes[monthKey()] = 1; }
  else {
    S.streakStart = t;
    if (S.challenge){ const c = chal(S.challenge.id); if (c && (!c.cats || c.cats.includes(cat))){ S.history.push({id:c.id, start:S.challenge.start, end:t, result:"ended"}); S.challenge = null; } }
  }
  if (itemId){ const i = findItem(itemId); if (i){ i.status = "bought"; i.decidedAt = Date.now(); } }
  save();
}
function commitDraft(status){
  const d = ask.draft, now = Date.now();
  const i = {id:uid(), name:d.name, price:Number(d.price)||0, cat:d.cat, url:d.url||"", reason:d.reason, createdAt:now, status, aiVerdict:ask.chat && ask.chat.verdict || ""};
  if (status === "waiting") i.readyAt = now + waitFor(d)*H;
  if (status === "buried") i.decidedAt = now;
  S.items.push(i); save();
  if (ask.chat && ask.chat.ctl) ask.chat.ctl.abort();
  ask = {step:"done", draft:null, chat:null, lastId:i.id};
}

function coachContext(){
  const P = S.profile || {}, bits = [];
  const tone = {gentle:"Be warm and gentle; soften questions.", honest:"Be calm and direct.", tough:"Be firm and hold them to their own goals, but never harsh or insulting."}[P.tone] || "";
  if (P.name) bits.push(`Their name is ${P.name}.`);
  if (allWeak(P).length) bits.push(`They say they over-indulge in: ${allWeak(P).join(", ")}.`);
  if ((P.times||[]).length) bits.push(`Urges usually hit: ${P.times.join(", ")}.`);
  if ((P.triggers||[]).length) bits.push(`Common triggers: ${P.triggers.join(", ")}.`);
  if (P.stopWhat) bits.push(`In their words: "I want to stop buying ${P.stopWhat}${P.because ? " because " + P.because : ""}."`);
  if (S.settings.goalName) bits.push(`They are saving for ${S.settings.goalName}.`);
  if (Number(P.monthlyFun)) bits.push(`Monthly fun budget ${money(P.monthlyFun)}, ${money(spentThisMonth())} spent so far this month.`);
  bits.push(`Their local time right now is ${new Date().toLocaleTimeString([], {hour:"numeric", minute:"2-digit"})} on ${new Date().toLocaleDateString(undefined,{weekday:"long"})}.`);
  return `\nWhat they've told you about themselves (use it when it is relevant, for example the time of day or their own words, but never recite it back as a list): ${bits.join(" ")}\n${tone}`;
}
const COACH_RULES = d => `You help an adult think through an impulse purchase before they make it. Write like a calm, perceptive friend: plain, direct, grown-up. No jokes, puns, wordplay or cute phrasing. Never mention the app, reapers, graveyards, ghosts or mascots. No openers like "Quick question" or "Great answer", no exclamation marks, no emoji, no markdown. Never lecture or shame.

The person wants to buy: ${d.name} (${d.cat}) for ${money(d.price)}.
Their reason, in their words: "${d.reason}"
${coachContext()}

Ask exactly ONE short question per message (under 25 words, just the question), aimed at what is really driving the urge: whether they already own something similar, how they're feeling right now, what happens if they wait, whether they would buy it at full price next month. Ask at most three questions in total. After their third answer (or sooner if it's clearly decided), reply with one line that starts with "VERDICT:" followed by either "Bury it." or "Ask your buddy." or "Sounds planned." and one short sentence why.`;

async function coachTurn(){
  const ch = ask.chat, d = ask.draft;
  ch.busy = true; ch.live = ""; ch.err = ""; ch.ctl = new AbortController(); render();
  const asked = ch.turns.filter(t => t.role === "assistant").length;
  const input = [{role:"user", content: COACH_RULES(d) + (asked === 0 ? "\n\nAsk your first question now." : "")}, ...ch.turns];
  if (asked >= 3) input.push({role:"user", content:"That was my last answer. Give the VERDICT line now."});
  try {
    const {text} = await sampleFn(input, {modelTier:"quick", cache:false, signal:ch.ctl.signal, onText:({text}) => { ch.live = text.replace(/VERDICT:\s*/i,""); renderChat(); }});
    ch.live = null;
    const m = text.match(/VERDICT:\s*([\s\S]*)/i);
    if (m){ const before = text.slice(0, m.index).trim(); if (before) ch.turns.push({role:"assistant", content:before}); ch.verdict = m[1].trim(); ch.done = true; }
    else ch.turns.push({role:"assistant", content:text.trim()});
  } catch(e){
    ch.live = null;
    const code = e && e.code;
    if (code === "cancelled"){ if (e.text) ch.turns.push({role:"assistant", content:e.text}); }
    else if (["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){ coachOff = true; ask.step = "decide"; ask.chat = null; ch.busy = false; render(); toast("The coach isn't available here. You can still send it on."); return; }
    else if (code === "rate_limited") ch.err = "The coach needs a breather. Try again in a bit, or skip it.";
    else if (code === "session_expired") ch.err = "Sign in again to use the coach.";
    else ch.err = "The coach got interrupted. Send your answer again, or skip it.";
  }
  ch.busy = false; ch.ctl = null; render();
  const inp = document.getElementById("c-in"); if (inp) inp.focus();
}

function seedExamples(){
  const now = Date.now(), t = today();
  S = fresh();
  Object.assign(S.settings, {buddy:"Maya", limit:60, waitHours:24, goalName:"Weekend trip", goalAmount:300});
  S.profile = {name:"Alex", reasons:["Save money","Stop stress shopping"], stopWhat:"makeup I already have dupes of", because:"I want that weekend trip", weak:["Makeup","Skincare","Candles"], weakOther:"", places:["TikTok Shop","Sephora"], times:["Late at night","Payday"], triggers:["Scrolling","Influencers"], monthlyFun:120, longerWait:true, buddyRel:"Best friend", buddyHow:"Text", buddyMsg:DEFAULT_MSG, tone:"honest", nudge:"soft"};
  S.startedAt = addDays(t,-45); S.streakStart = addDays(t,-12); S.best = 21; S.exampleMode = true;
  S.slips.push({date:addDays(t,-24), name:"Matte lipstick", price:22, cat:"Makeup", freeze:false, example:true});
  S.slips.push({date:addDays(t,-12), name:"Throw blanket", price:38, cat:"Home", freeze:false, example:true});
  S.slips.push({date:addDays(t,-5), name:"Lip liner", price:14, cat:"Makeup", freeze:true, example:true});
  S.freezes[monthKey()] = 1;
  const mk = (name, price, cat, reason, cAgo, dAgo, extra = {}) => Object.assign({id:uid(), name, price, cat, url:"", reason, createdAt:now - cAgo*D, decidedAt:dAgo == null ? undefined : now - dAgo*D, status:"buried", example:true}, extra);
  S.items.push(
    mk("24-shade palette",54,"Makeup","Everyone on my feed has it and it's 20% off",40,37),
    mk("Linen blazer",89,"Clothes","I need something for the interview, maybe",22,17),
    mk("Glossy lip trio",28,"Makeup","Limited edition, the pink one is so cute",15,14),
    mk("Velvet throw pillows",46,"Home","My couch looks boring",9,8),
    mk("Platform loafers",72,"Clothes","Saw them in a video and want them",5,3),
    mk("Brow gel",18,"Makeup","Mine is almost out, I think",1.2,null,{status:"waiting", readyAt:now - 2*H}),
    mk("Ceramic candle holder",34,"Home","It would look nice on my desk",0.8,null,{status:"waiting", readyAt:now + 5*H}),
    mk("Wool coat",140,"Clothes","Winter is coming and my coat is old",1,null,{status:"buddy"})
  );
  save();
}

/* ---------- events ---------- */
const actions = {
  go: id => { location.hash = id; },
  calPrev: () => { calOffset--; render(); },
  calNext: () => { calOffset = Math.min(0, calOffset + 1); render(); },
  wizBack: () => { if (!wiz) return; const f = document.querySelector('form[data-form="wiz"]'); if (f && wiz.step < 6) wizCollect(new FormData(f)); wiz.step = Math.max(0, wiz.step - 1); render(); window.scrollTo(0,0); },
  wizCancel: () => { wiz = null; render(); },
  editProfile: () => { startWizard(true); render(); window.scrollTo(0,0); },
  menu: () => { const sd = document.getElementById("side"); const open = !sd.classList.contains("open"); sd.classList.toggle("open", open); document.getElementById("navscrim").hidden = !open; document.querySelector('[data-act="menu"]').setAttribute("aria-expanded", String(open)); },
  menuClose: () => closeMenu(),
  pet: (id, el) => { el.classList.remove("pet"); void el.getBoundingClientRect(); el.classList.add("pet"); clearTimeout(el._pt); el._pt = setTimeout(() => el.classList.remove("pet"), 1200); },
  slip: () => { sheet = {type:"slip"}; render(); setTimeout(() => document.getElementById("s-name")?.focus(), 30); },
  buy: id => { const i = findItem(id); sheet = {type:"slip", item:i}; render(); },
  bury: id => { const i = findItem(id); if (!i) return; bury(i); render(); ripOverlay(i); },
  approve: id => { const i = findItem(id); if (!i) return; i.status = "approved"; i.buddyVerdict = "yes"; save(); render(); },
  deny: id => { const i = findItem(id); if (!i) return; i.buddyVerdict = "no"; bury(i); render(); ripOverlay(i); },
  waitweek: id => { const i = findItem(id); if (!i) return; i.status = "waiting"; i.buddyVerdict = "wait"; i.readyAt = Date.now() + 7*D; save(); render(); toast("Back in the waiting room for a week."); },
  buyok: id => { const i = findItem(id); if (!i) return; i.status = "bought"; i.planned = true; i.decidedAt = Date.now(); save(); render(); toast("Planned purchase logged. Streak safe."); },
  copy: (id, btn) => {
    const i = findItem(id); if (!i) return; const txt = buddyMsg(i);
    const sel = () => { const el = document.getElementById("msg-" + id); if (el){ const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Selected. Copy it from here."); };
    try { navigator.clipboard.writeText(txt).then(() => toast("Copied. Send it to " + buddyName() + "."), sel); } catch(e){ sel(); }
  },
  claim: () => { const amt = Number(S.settings.goalAmount)||0; S.claimed = (S.claimed||0) + amt; S.claims.push({date:today(), amount:amt, name:S.settings.goalName}); save(); render(); toast("Enjoy it. That one was earned."); },
  examples: () => { seedExamples(); location.hash = "home"; render(); },
  clearExamples: () => {
    if (S.exampleMode){ S = fresh(); }
    else { S.items = S.items.filter(i => !i.example); S.slips = S.slips.filter(s => !s.example); }
    save(); location.hash = "home"; render(); toast("Example data removed.");
  },
  resetAsk: () => { sheet = {type:"confirmReset"}; render(); },
  doReset: () => { S = fresh(); sheet = null; ask = {step:"form", draft:null, chat:null, shot:null}; save(); location.hash = "home"; render(); },
  closeSheet: (id, el, e) => { if (el.classList.contains("scrim") && e.target !== el) return; sheet = null; render(); },
  filter: id => { gFilter = id; render(); },
  rip: id => { const i = findItem(id); if (!i) return; i.revisited = true; i.forgotten = true; save(); render(); toast("Forgotten for good."); },
  resurrect: id => { const i = findItem(id); if (!i) return; i.revisited = true; i.status = "buddy"; i.createdAt = Date.now(); save(); location.hash = "home"; render(); toast("It rises. Ask " + buddyName() + " first."); },
  start: id => { S.challenge = {id, start:today()}; save(); render(); toast(chal(id).name + " starts today."); },
  quit: () => { const c = chal(S.challenge.id); S.history.push({id:c.id, start:S.challenge.start, end:today(), result:"ended"}); S.challenge = null; save(); render(); },
  route: () => { commitDraft(routeFor(ask.draft)); render(); },
  buryDraft: () => { commitDraft("buried"); render(); const i = findItem(ask.lastId); if (i) ripOverlay(i); },
  editDraft: () => { ask.step = "form"; render(); },
  coach: () => { ask.chat = {turns:[], busy:false, done:false, verdict:"", live:null, err:""}; ask.step = "chat"; coachTurn(); },
  stop: () => { ask.chat && ask.chat.ctl && ask.chat.ctl.abort(); },
  skipCoach: () => { if (ask.chat && ask.chat.ctl) ask.chat.ctl.abort(); ask.chat = null; ask.step = "decide"; render(); }
};
const forms = {
  wiz: fd => { if (!wiz) return; if (wiz.step === 6){ wizFinish(); return; } if (!wizCollect(fd)) return; wiz.step++; render(); window.scrollTo(0,0); },
  setup: fd => {
    const st = S.settings;
    st.buddy = String(fd.get("buddy")||"").trim(); st.limit = Math.max(0, Number(fd.get("limit"))||0);
    st.waitHours = Number(fd.get("waitHours"))||24; st.goalName = String(fd.get("goalName")||"").trim(); st.goalAmount = Math.max(0, Number(fd.get("goalAmount"))||0);
    const first = !S.startedAt;
    if (first){ S.startedAt = today(); S.streakStart = today(); }
    save(); toast(first ? "Your streak starts tonight." : "Saved."); location.hash = "home"; render();
  },
  ask: fd => {
    const reason = String(fd.get("reason")||"").trim();
    if (reason.length < 15){ toast("Give it a real reason, at least 15 characters."); return; }
    ask.draft = {name:String(fd.get("name")).trim(), price:Number(fd.get("price"))||0, url:String(fd.get("url")||"").trim(), cat:String(fd.get("cat")||"Other"), reason};
    ask.step = "decide"; render(); window.scrollTo(0,0);
  },
  slip: fd => {
    logSlip({name:String(fd.get("name")).trim(), price:fd.get("price"), cat:String(fd.get("cat")), freeze:fd.get("freeze") === "on", itemId:sheet && sheet.item && sheet.item.id});
    const froze = fd.get("freeze") === "on"; sheet = null; render(); toast(froze ? "Logged. Your freeze kept the streak alive." : "Logged. Tonight is night one again.");
  },
  chat: fd => {
    const ch = ask.chat, m = String(fd.get("msg")||"").trim(); if (!m || !ch || ch.busy) return;
    ch.turns.push({role:"user", content:m}); coachTurn();
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.classList.contains("scrim") && e.target.closest("[data-stop]")) return;
  const fn = actions[el.dataset.act]; if (fn){ if (el.tagName === "BUTTON") e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener("submit", e => { const f = e.target; if (!f.dataset.form) return; e.preventDefault(); forms[f.dataset.form] && forms[f.dataset.form](new FormData(f), f); });
document.addEventListener("keydown", e => { if (e.key === "Escape"){ closeMenu(); if (sheet){ sheet = null; render(); } } });

function onHash(){
  const h = (location.hash || "#home").slice(1);
  const next = ["home","ask","challenges","graveyard","setup"].includes(h) ? h : "home";
  if (next === "ask" && view !== "ask" && ask.step === "done") ask = {step:"form", draft:null, chat:null, shot:null};
  if (wiz && wiz.edit && next !== "setup") wiz = null;
  view = next; render(); window.scrollTo(0,0); if (view === "home") countUp();
}
window.addEventListener("hashchange", onHash);
document.addEventListener("input", e => { if (e.target.id === "w-fun"){ const o = document.getElementById("w-fun-out"); if (o) o.textContent = money(e.target.value); } });
setInterval(() => {
  if (view !== "home") return;
  let crossed = false;
  document.querySelectorAll("[data-ready]").forEach(el => { const ms = Number(el.dataset.ready) - Date.now(); if (ms <= 0) crossed = true; el.textContent = left(ms); });
  if (crossed && !document.activeElement?.matches("input,textarea,select") && !sheet) render();
}, 30000);
function countUp(){
  const el = document.getElementById("streakNum"); if (!el) return;
  const target = Number(el.textContent) || 0; if (!target || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const t0 = performance.now(), dur = 900;
  const step = t => { const p = Math.min(1, (t - t0)/dur); el.textContent = Math.round(target * (1 - Math.pow(1-p,3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

view = ["home","ask","challenges","graveyard","setup"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "home";
render();
initStore();
})();
</script>
